<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>All Blogs — Forid Ahmed</title>
<style>
body{margin:0;background:#f4f7f5;color:#17231d;font-family:Arial,"Noto Sans Bengali",sans-serif}
header{background:#0b3d2e;color:#fff;padding:18px}nav{max-width:1000px;margin:auto;display:flex;justify-content:space-between}
nav a{color:#fff;text-decoration:none;font-weight:700}.wrap{max-width:1000px;margin:auto;padding:25px 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.card{background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #0001}.card img{width:100%;height:180px;object-fit:cover}
.body{padding:17px}.body h2{font-size:20px}.btn{display:inline-block;background:#0b3d2e;color:#fff;text-decoration:none;padding:9px 14px;border-radius:7px}
footer{text-align:center;background:#0b3d2e;color:#fff;padding:25px;margin-top:40px}
</style></head><body>
<header><nav><a href="index.html">Forid Ahmed</a><a href="index.html">Home</a></nav></header>
<main class="wrap"><h1>সকল Blog</h1><p>posts.json-এ নতুন Blog যোগ করলে এখানে automatically দেখাবে।</p>
<section id="list" class="grid">Loading...</section></main><footer>© Forid Ahmed</footer>
<script>
fetch("posts.json").then(r=>r.json()).then(posts=>{
posts.sort((a,b)=>Number(b.id)-Number(a.id));
document.getElementById("list").innerHTML=posts.map(p=>`
<article class="card"><img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">
<div class="body"><h2>${p.title}</h2><p>${p.description}</p><small>${p.date}</small><br><br>
<a class="btn" href="blog-post-${p.id}.html">সম্পূর্ণ পড়ুন →</a></div></article>`).join("");
});
</script></body></html>
