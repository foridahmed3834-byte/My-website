<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forid Ahmed — Blog</title>
<meta name="description" content="Forid Ahmed-এর Blog">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="container"><nav>
<a class="brand" href="index.html">Forid Ahmed</a>
<a href="index.html">Home / Blog</a>
</nav></div></header>
<main class="container">
<section class="hero">
<h1>আমার Blog</h1>
<p>নতুন Blog প্রকাশিত হলে এই তালিকায় যোগ হবে।</p>
</section>
<section id="posts" class="grid"></section>
</main>
<footer>© Forid Ahmed</footer>
<script>
fetch("posts.json").then(r=>r.json()).then(posts=>{
  posts.sort((a,b)=>b.id-a.id);
  document.getElementById("posts").innerHTML=posts.map(p=>`
  <div class="card">
    <img src="${p.image}" alt="${p.title}" onerror="this.style.display='none'">
    <div class="card-body">
      <h2>${p.title}</h2>
      <p>${p.description}</p>
      <a class="btn" href="blog-post-${p.id}.html">পড়ুন →</a>
    </div>
  </div>`).join("");
});
</script>
</body>
</html>
